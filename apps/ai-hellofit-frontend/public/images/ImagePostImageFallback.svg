<svg
  xmlns="http://www.w3.org/2000/svg"
  width="512"
  height="512"
  viewBox="0 0 512 512"
>
  <!-- 배경 (연한 회색) -->
  <rect width="512" height="512" fill="#e0e0e0" />

  <!-- 카메라 아이콘 -->
  <g fill="none" stroke="#555" stroke-width="20" stroke-linecap="round" stroke-linejoin="round">
    <!-- 카메라 본체 -->
    <rect x="128" y="176" width="256" height="192" rx="24" ry="24" />
    <!-- 카메라 상단 (뷰파인더) -->
    <rect x="192" y="128" width="128" height="64" rx="12" ry="12" />
    <!-- 렌즈 -->
    <circle cx="256" cy="272" r="60" />
    <!-- 렌즈 디테일 -->
    <circle cx="256" cy="272" r="20" />
  </g>
</svg>
